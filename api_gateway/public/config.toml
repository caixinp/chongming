[default]
debug = false
description = "chongming-gateway (Docker)"
name = "chongming-gateway"
version = "v0.1.0"
env = "production"
prefix = "/api/v1"

[nats]
urls = ["nats://nats-1:4222", "nats://nats-2:4222", "nats://nats-3:4222"]

[database]
type = "pgsql"

[database.master]
host = "pg-master"
port = "5432"
username = "myuser"
password = "mypassword"

[database.slave]
host = "pg-slave"
port = "5433"
username = "myuser"
password = "mypassword"

[cleanup]
interval = 10

[logging.minio]
enabled = true
endpoint = "minio-1:9000"
bucket = "chongming-logs"
retention_days = 30
