[default]
debug = true
description = ""
name = "chongming-gateway"
version = "v0.1.0"
env = "development"
prefix = "/api/v1"

[nats]
urls = ["nats://localhost:4222", "nats://localhost:4223", "nats://localhost:4224"]

[database]
type = "pgsql"

[database.master]
host = "localhost"
port = "5432"
username = "myuser"
password = "mypassword"

[database.slave]
host = "localhost"
port = "5433"
username = "myuser"
password = "mypassword"

[cleanup]
interval = 10  # 过期路由清理检查间隔（秒），TTL 必须大于此值

[logging.minio]
enabled = true
endpoint = "localhost:9000"
bucket = "chongming-logs"
retention_days = 30

[jwt]
enabled = true
algorithm = "HS256"
secret_key = "your-256-bit-secret-here-change-in-production"
issuer = "chongming"
audience = "chongming-api"
user_id_claim = "sub"
roles_claim = "roles"
whitelist_paths = [
    "/health",
    "/docs",
    "/openapi.json",
]
