[worker]
name = "rust-example"
version = "0.1.0"
description = "Rust implementation of example worker - production"

[nats]
urls = [
    "nats://nats-1:4222",
    "nats://nats-2:4222",
    "nats://nats-3:4222"
]

[registration]
type = "register"
service = "calc"
queue_group = "calc-workers"
router_prefix = "/calc"
tags = ["calculator_rust", "production"]
heartbeat_interval = 15

[[registration.items]]
subject = "calc.add"
method = "GET"
path = "/add"
summary = "Add two numbers"
docstring = "Add two numbers and return result with metadata"
params = ["a: float", "b: float"]
ttl = 30
timeout = 2.0
response_model = { result = ["float", "__required__"], operation = ["str", "add"], timestamp = ["float", 0.0] }

[[registration.items]]
subject = "calc.subtract"
method = "GET"
path = "/subtract"
summary = "Subtract two numbers"
docstring = "Subtract b from a and return result with metadata"
params = ["a: float", "b: float"]
ttl = 30
timeout = 2.0
response_model = { result = ["float", "__required__"], operation = ["str", "subtract"], timestamp = ["float", 0.0] }

[[registration.items]]
subject = "calc.multiply"
method = "GET"
path = "/multiply"
summary = "Multiply two numbers"
docstring = "Multiply two numbers and return result with metadata"
params = ["a: float", "b: float"]
ttl = 30
timeout = 2.0
response_model = { result = ["float", "__required__"], operation = ["str", "multiply"], timestamp = ["float", 0.0] }

[[registration.items]]
subject = "calc.divide"
method = "GET"
path = "/divide"
summary = "Divide two numbers"
docstring = "Divide a by b and return result with metadata"
params = ["a: float", "b: float"]
ttl = 30
timeout = 2.0
response_model = { result = ["float", "__required__"], operation = ["str", "divide"], timestamp = ["float", 0.0] }

[logging.minio]
enabled = true
endpoint = "minio-1:9000"
bucket = "chongming-logs"
retention_days = 30
