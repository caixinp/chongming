[worker]
name = "rust-example"
version = "0.1.0"
description = "Rust implementation of example worker"
config_version = "2.0"

[nats]
urls = [
    "nats://localhost:4222",
    "nats://localhost:4223",
    "nats://localhost:4224"
]

[registration]
type = "register"
service = "calc"
queue_group = "calc-workers"
router_prefix = "/calc"
tags = ["calculator_rust"]
heartbeat_interval = 15
config_version = "2.0"

# ── 默认值继承 ──────────────────────────────────────────
defaults = { method = "GET", ttl = 30, timeout = 2.0, auth_required = true }

items = [
    {
        subject = "calc.add",
        path = "/add",
        summary = "Add two numbers",
        docstring = "Add two numbers and return result with metadata",
        params = ["a: float", "b: float"],
        response_model = {
            result = { type = "float", required = true },
            operation = { type = "str", default = "add" },
            timestamp = { type = "float", default = 0.0 }
        }
    },
    {
        subject = "calc.subtract",
        path = "/subtract",
        summary = "Subtract two numbers",
        docstring = "Subtract b from a and return result with metadata",
        params = ["a: float", "b: float"],
        response_model = {
            result = { type = "float", required = true },
            operation = { type = "str", default = "subtract" },
            timestamp = { type = "float", default = 0.0 }
        }
    },
    {
        subject = "calc.multiply",
        path = "/multiply",
        summary = "Multiply two numbers",
        docstring = "Multiply two numbers and return result with metadata",
        params = ["a: float", "b: float"],
        response_model = {
            result = { type = "float", required = true },
            operation = { type = "str", default = "multiply" },
            timestamp = { type = "float", default = 0.0 }
        }
    },
    {
        subject = "calc.divide",
        path = "/divide",
        summary = "Divide two numbers",
        docstring = "Divide a by b and return result with metadata",
        params = ["a: float", "b: float"],
        response_model = {
            result = { type = "float", required = true },
            operation = { type = "str", default = "divide" },
            timestamp = { type = "float", default = 0.0 }
        }
    }
]
