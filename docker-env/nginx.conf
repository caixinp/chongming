# =============================================
# chongming Nginx 配置
# 功能：前端静态资源 + API 反向代理
# =============================================

upstream gateway_cluster {
    least_conn;
    server api-gateway-1:8000 max_fails=3 fail_timeout=10s;
    server api-gateway-2:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # 请求体大小限制（用于大文件上传等场景）
    client_max_body_size 100m;

    # 超时配置
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # =============================================
    # 前端静态资源（Vue SPA）
    # =============================================
    root /usr/share/nginx/html;
    index index.html;

    # 前端静态文件（带有 hash 的文件长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端图标等
    location /favicon.ico {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # =============================================
    # API 路由转发到后端 Gateway 集群
    # =============================================

    # Nginx 自身健康检查
    location /nginx/health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # API 路由（/api/ 开头的请求转发到后端）
    location /api/ {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 禁用缓存（API 场景）
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # 重试机制
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # =============================================
    # SPA 路由：所有非文件、非 API 的请求返回 index.html
    # =============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =============================================
    # 错误页面
    # =============================================
    error_page 502 503 /502.html;
    location = /502.html {
        internal;
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><title>Gateway Error</title></head><body style="font-family: Arial, sans-serif; text-align: center; padding: 50px;"><h1>502 Bad Gateway</h1><p>网关服务暂时不可用，请稍后重试。</p></body></html>';
    }
}
