[package]
name = "chongming-worker"
version = "0.1.0"
edition = "2021"
description = "Chongming Worker Lifespan Framework for Rust - NATS-based worker lifecycle management"

[lib]
name = "chongming_worker"

[dependencies]
anyhow = "1.0"
async-nats = "0.49"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
