[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "chongming-permission"
version = "0.1.0"
description = "Distributed permission cache based on NATS KV"
requires-python = ">=3.12"
dependencies = [
    "chongming-cache",
]

[tool.uv.sources]
chongming-cache = { path = "../cache" }

[tool.hatch.build.targets.wheel]
packages = ["src/chongming_permission"]
