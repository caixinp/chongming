[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "chongming-jwt"
version = "0.1.0"
description = "JWT authentication utility for chongming gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyjwt",
    "cryptography",
]

[[tool.uv.index]]
default = true
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.hatch.build.targets.wheel]
packages = ["src/chongming_jwt"]
