[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "chongming-cache"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chongming-config",
    "nats-py>=2.14.0",
]

[[tool.uv.index]]
default = true
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.uv.sources]
chongming-config = { path = "../config" }

[tool.hatch.build.targets.wheel]
packages = ["src/chongming_cache"]
