[worker]
name = "user_auth"
version = "0.1.0"
description = "chongming worker example - production"
config_version = "2.0"

[nats]
urls = [
    "nats://nats-1:4222",
    "nats://nats-2:4222",
    "nats://nats-3:4222"
]

[registration]
type = "register"
service = "user_auth"
queue_group = "user_auth"
router_prefix = "/user_auth"
tags = ["user_auth", "production"]
heartbeat_interval = 15
config_version = "2.0"

# ── 默认值继承 ──────────────────────────────────────────
defaults = { method = "POST", ttl = 30, timeout = 2.0, auth_required = false }

items = [
    {
        subject = "user.auth",
        path = "/user/auth",
        shared = true,
        summary = "用户验证",
        params = ["user_id: str", "roles: list[str]", "username: str", "email: str", "other: dict[str,Any]"],
        response_model = {
            status = { type = "bool", required = true },
            token = { type = "str", required = true },
            timestamp = { type = "float", default = 0.0 }
        },
        internal = true,
    },
    {
        subject = "user.login",
        path = "/user/login",
        shared = true,
        docstring = "用户登录",
        params = ["user_name: str", "password: str"],
        response_model = {
            status = { type = "bool", required = true },
            token = { type = "str", required = true },
            user_id = { type = "str", required = true },
            username = { type = "str", required = true },
            email = { type = "str", required = true },
            other = { type = "dict", required = true },
            roles = { type = "str", required = true },
            timestamp = { type = "float", default = 0.0 }
        }
    },
    {
        subject = "user.register",
        path = "/user/register",
        shared = true,
        summary = "用户注册",
        params = ["username: str", "password: str", "email: str"],
        response_model = {
            status = { type = "bool", required = true },
            token = { type = "str", required = true },
            user_id = { type = "int", required = true },
            username = { type = "str", required = true },
            email = { type = "str", required = true },
            roles = { type = "list", required = true },
            timestamp = { type = "float", default = 0.0 }
        }
    },
    {
        subject = "user.create",
        path = "/user/create",
        summary = "创建用户（内部）",
        params = ["username: str", "password_hash: str", "email: str", "roles: list[str]"],
        response_model = {
            id = { type = "int", required = true },
            username = { type = "str", required = true },
            email = { type = "str", required = true },
            roles = { type = "list", required = true },
            created_at = { type = "float", required = true }
        },
        internal = true,
    },
    {
        subject = "user.get",
        path = "/user/get",
        shared = true,
        summary = "获取用户",
        params = ["user_id: int"],
        response_model = {
            id = { type = "int", required = true },
            username = { type = "str", required = true },
            email = { type = "str", required = true },
            roles = { type = "list", required = true }
        },
        internal = true,
    },
    {
        subject = "user.update",
        path = "/user/update",
        shared = true,
        summary = "更新用户",
        params = ["user_id: int", "username: str", "email: str", "roles: list[str]"],
        response_model = {
            id = { type = "int", required = true },
            username = { type = "str", required = true },
            email = { type = "str", required = true },
            roles = { type = "list", required = true }
        },
        internal = true,
    },
    {
        subject = "user.delete",
        path = "/user/delete",
        shared = true,
        summary = "删除用户",
        params = ["user_id: int"],
        response_model = {
            status = { type = "bool", required = true },
            message = { type = "str", required = true }
        },
        internal = true,
    },
    {
        subject = "user.list",
        path = "/user/list",
        shared = true,
        summary = "用户列表",
        params = ["offset: int", "limit: int"],
        response_model = {
            users = { type = "list", required = true },
            total = { type = "int", required = true },
            offset = { type = "int", required = true },
            limit = { type = "int", required = true }
        },
        internal = true,
    }
]

[logging.minio]
enabled = true
endpoint = "minio:9000"
bucket = "chongming-logs"
retention_days = 30
