[package]
name = "example_rs"
version = "0.2.0"
edition = "2021"
description = "Example Rust worker using the chongming-worker lifespan framework"

[dependencies]
anyhow = "1.0.102"
async-nats = "0.49.0"
chongming-worker = { path = "../../utils/rust/worker" }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
