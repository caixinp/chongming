version = 1
revision = 3
requires-python = ">=3.12"

[manifest]
members = [
    "chongming",
    "chongming-cli",
]

[[package]]
name = "chongming"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "chongming-cli" },
]

[package.metadata]
requires-dist = [{ name = "chongming-cli", editable = "cli" }]

[[package]]
name = "chongming-cli"
version = "0.1.0"
source = { editable = "cli" }
